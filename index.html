<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yoklama">
<title>Yoklama</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#111315; --card:#171a1d; --sunk:#0d0f11; --line:#22272b;
  --fg:#d3d7d9; --muted:#7a8287; --faint:#454c51;
  --ok:#86b08a; --no:#d08473; --off:#8a9096; --acc:#8fb3d9;
  --c1:#6f93b8; --c2:#b98f62; --c3:#86a96c; --c4:#b9a76d; --c5:#9d84ad; --c6:#6aa59b;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.w{max-width:520px;margin:0 auto;padding-block:18px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{font-size:12px;color:var(--muted)}
h1{font-size:26px;font-weight:600;margin:2px 0 16px;letter-spacing:-.01em}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{font:500 14px var(--f);color:var(--muted);background:transparent;border:0;border-radius:8px;padding:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:14px}
.nav button.ar{height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:20px;cursor:pointer}
.nav button.ar:disabled{opacity:.3;cursor:default}
.dt{text-align:center}
.dt b{display:block;font-size:17px;font-weight:600}
.dt span{font-size:12px;color:var(--muted)}
.todayb{display:block;margin:-6px auto 14px;font:500 12px var(--f);color:var(--acc);background:none;border:0;cursor:pointer}
.note{font-size:13px;color:var(--c4);background:color-mix(in oklab,var(--c4) 10%,var(--bg));border-radius:10px;padding:10px 12px;margin-bottom:12px}
.info{font-size:13px;color:var(--muted);margin-bottom:12px;text-align:center}
.cards{display:grid;gap:12px}
.card{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:12px}
.hd{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);margin-top:6px}
.nm{font-size:16px;font-weight:600;line-height:1.25}
.sb{font-size:12.5px;color:var(--muted);margin-top:2px}
.hr{font:12px var(--m);color:var(--faint);padding-top:3px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{font:500 14px var(--f);padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.seg button[data-s="g"][aria-pressed="true"]{background:color-mix(in oklab,var(--ok) 20%,var(--card));border-color:color-mix(in oklab,var(--ok) 45%,var(--card));color:var(--ok)}
.seg button[data-s="y"][aria-pressed="true"]{background:color-mix(in oklab,var(--no) 20%,var(--card));border-color:color-mix(in oklab,var(--no) 45%,var(--card));color:var(--no)}
.seg button[data-s="i"][aria-pressed="true"]{background:color-mix(in oklab,var(--off) 16%,var(--card));border-color:color-mix(in oklab,var(--off) 40%,var(--card));color:var(--fg)}
.empty{background:var(--card);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border-radius:12px;padding:12px}
.sum b{display:block;font:500 22px var(--m);font-variant-numeric:tabular-nums}
.sum span{font-size:11.5px;color:var(--muted)}
.sum .no b{color:var(--no)}
.pend{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;font:500 13px var(--f);color:var(--c4);background:color-mix(in oklab,var(--c4) 9%,var(--bg));border:0;border-radius:10px;padding:11px 12px;margin-bottom:12px;cursor:pointer;text-align:left}
.lst{display:grid;gap:10px}
.row{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:10px}
.nums{display:flex;gap:16px;font:13px var(--m);color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.nums .y{color:var(--no)} .nums .g{color:var(--ok)}
.big{font:500 20px var(--m);color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
.big small{display:block;font:11px var(--f);color:var(--muted)}
.big.bad{color:var(--no)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:18px;height:18px;border-radius:4px;border:1px solid var(--faint);background:transparent;padding:0;cursor:pointer}
.dots button.g{background:var(--ok);border-color:var(--ok)}
.dots button.y{background:var(--no);border-color:var(--no)}
.dots button.i{background:var(--faint);border-color:var(--faint)}
.dots button.fut{opacity:.25;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--faint)}
.set{margin-top:22px;display:grid;gap:12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.set .ln{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.set input[type=date]{font:13px var(--m);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bk button,.bk label{font:500 13px var(--f);text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.msg{font-size:12px;color:var(--muted);min-height:1em}
@media (prefers-reduced-motion:reduce){.seg button{transition:none}}
</style>
</head>
<body>
<div class="w">
  <div class="top">Elektrik Mühendisliği · 2026–27 Güz</div>
  <h1>Yoklama</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tGun" aria-selected="true">Gün</button>
    <button role="tab" id="tDur" aria-selected="false">Durum</button>
  </div>
  <section id="vGun"></section>
  <section id="vDur" hidden></section>
</div>

<script>
const L={
  em1:{n:"Elektrik Makinaları I",tag:"Pazartesi listesi",c:1},
  ot:{n:"Otonom Araçlar ve Robotik",c:5},
  ge:{n:"Güç Elektroniği",c:2},
  ay:{n:"Aydınlatma Tekniği ve Lab.",c:4},
  em3:{n:"Elektrik Makinaları I",tag:"Çarşamba listesi",c:1},
  es:{n:"Elektrik Sistemleri ve End. Uyg.",c:6},
  ok:{n:"Otomatik Kontrol Sistemleri",c:3}
};
const WEEK=[
  {w:1,l:"em1",t:"09:00",e:"11:50",h:3,r:"2004"},
  {w:1,l:"ot",t:"15:00",e:"16:50",h:2,r:"2004"},
  {w:2,l:"ge",t:"09:00",e:"11:50",h:3,r:"Derslik 212"},
  {w:2,l:"ay",t:"14:00",e:"16:50",h:3,r:"2008"},
  {w:3,l:"em3",t:"11:00",e:"11:50",h:1,r:"Derslik 212"},
  {w:3,l:"es",t:"13:00",e:"14:50",h:2,r:"2003"},
  {w:4,l:"ok",t:"09:00",e:"11:50",h:3,r:"2004"}
];
const ONCE=[{d:"2026-10-29",l:"ay",t:"15:00",e:"15:50",h:1,r:"2010",tag:"tek seferlik"}];
const HOL={"2026-10-29":"Cumhuriyet Bayramı (resmî tatil). Ders yapılmadıysa “Yapılmadı” işaretle.","2027-01-01":"Yılbaşı (resmî tatil)."};
const END="2027-01-15";
const KEY="yoklama-v1";

const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dow=s=>(pd(s).getDay()+6)%7+1;
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const trDate=(s,o)=>pd(s).toLocaleDateString("tr-TR",o||{weekday:"long",day:"numeric",month:"long"});
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const today=()=>ds(new Date());

let START="2026-09-28";
const rec=new Map();   // "YYYY-MM-DD_list" -> "g" | "y" | "i"

function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY)||"{}");if(o.start)START=o.start;Object.entries(o.rec||{}).forEach(([k,v])=>rec.set(k,v))}catch(e){}
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({start:START,rec:Object.fromEntries(rec)}))}catch(e){}
}

function sessions(d){
  return [...WEEK.filter(x=>x.w===dow(d)),...ONCE.filter(x=>x.d===d)].map(x=>({...x,d,id:d+"_"+x.l})).sort((a,b)=>mins(a.t)-mins(b.t));
}
function allOcc(to){const out=[];for(let d=START;d<=to;d=add(d,1))out.push(...sessions(d));return out}
function started(o){const t=today();return o.d<t||(o.d===t&&nowMin()>=mins(o.t))}
function classDay(from,dir){let d=from;for(let i=0;i<200;i++){d=add(d,dir);if(d<START||d>END)return null;if(sessions(d).length)return d}return null}
const home=()=>{const t=today();return sessions(t).length?t:(classDay(t,1)||t)};
let view=home();

function save(id,s){if(s)rec.set(id,s);else rec.delete(id);persist();render()}

function render(){renderGun();renderDur()}

function renderGun(){
  const el=document.getElementById("vGun"),t=today(),list=sessions(view);
  const prev=classDay(view,-1),next=classDay(view,1);
  let h=`<div class="nav"><button class="ar" id="pv" aria-label="Önceki ders günü" ${prev?"":"disabled"}>‹</button>
    <div class="dt"><b>${trDate(view)}</b><span>${view===t?"Bugün":view<t?"Geçmiş gün":"İleri tarih"}</span></div>
    <button class="ar" id="nx" aria-label="Sonraki ders günü" ${next?"":"disabled"}>›</button></div>`;
  if(view!==home())h+=`<button class="todayb" id="gt">Bugüne dön</button>`;
  else if(view!==t)h+=`<div class="info">Bugün ders yok. Sıradaki ders günü gösteriliyor.</div>`;
  if(HOL[view])h+=`<div class="note">${HOL[view]}</div>`;
  if(!list.length)h+=`<div class="empty">Bu gün ders yok.</div>`;
  h+=`<div class="cards">`+list.map(o=>{
    const s=rec.get(o.id)||"",c=L[o.l];
    const tag=[c.tag,o.tag].filter(Boolean).join(" · ");
    return `<div class="card" style="--c:var(--c${c.c})"><div class="hd"><span class="dot"></span>
      <div><div class="nm">${c.n}</div><div class="sb">${o.t}–${o.e} · ${o.r}${tag?" · "+tag:""}</div></div><span class="hr">${o.h} sa</span></div>
      <div class="seg" data-id="${o.id}">
        <button data-s="g" aria-pressed="${s==="g"}">✓ Geldim</button>
        <button data-s="y" aria-pressed="${s==="y"}">✗ Gelmedim</button>
        <button data-s="i" aria-pressed="${s==="i"}">Yapılmadı</button></div></div>`;
  }).join("")+`</div>`;
  el.innerHTML=h;
}

function renderDur(){
  const el=document.getElementById("vDur"),t=today();
  const occ=allOcc(END);
  let G=0,Y=0,YH=0;const pending=[];
  occ.forEach(o=>{const s=rec.get(o.id);if(s==="g")G++;if(s==="y"){Y++;YH+=o.h}if(!s&&started(o))pending.push(o)});
  let h=`<div class="sum"><div><b>${G}</b><span>Geldim</span></div><div class="no"><b>${Y}</b><span>Devamsızlık (gün)</span></div><div class="no"><b>${YH}</b><span>Devamsızlık (saat)</span></div></div>`;
  if(pending.length)h+=`<button class="pend" data-d="${pending[0].d}"><span>${pending.length} geçmiş ders işaretlenmemiş</span><span>${trDate(pending[0].d,{day:"numeric",month:"short"})} ›</span></button>`;
  h+=`<div class="lst">`+Object.entries(L).map(([k,c])=>{
    const os=occ.filter(o=>o.l===k);
    let g=0,y=0,yh=0,i=0;os.forEach(o=>{const s=rec.get(o.id);if(s==="g")g++;if(s==="y"){y++;yh+=o.h}if(s==="i")i++});
    const dots=os.map(o=>{const s=rec.get(o.id)||"";const fut=!started(o)&&!s;const lbl=trDate(o.d,{day:"numeric",month:"long"})+(o.tag?" ("+o.tag+")":"");
      return `<button class="${s}${fut?" fut":""}" data-d="${o.d}" title="${lbl}" aria-label="${lbl}" ${fut?"tabindex=-1":""}></button>`}).join("");
    return `<div class="row" style="--c:var(--c${c.c})"><div class="hd"><span class="dot"></span>
      <div><div class="nm">${c.n}</div><div class="sb">${c.tag||WEEK.filter(x=>x.l===k).map(x=>["","Pzt","Sal","Çar","Per"][x.w]+" "+x.t).join(", ")}</div></div>
      <div class="big${y?" bad":""}">${y}<small>${yh} saat</small></div></div>
      <div class="nums"><span class="g">✓ ${g}</span><span class="y">✗ ${y}</span><span>yapılmadı ${i}</span></div>
      <div class="dots">${dots}</div></div>`;
  }).join("")+`</div>
  <div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>Geldim</span><span><i style="background:var(--no);border-color:var(--no)"></i>Gelmedim</span><span><i style="background:var(--faint)"></i>Yapılmadı</span><span><i></i>İşaretsiz</span></div>
  <div class="set">
    <div class="ln"><label for="st">Dönem başlangıcı</label><input type="date" id="st" value="${START}" max="${t}"></div>
    <div class="bk"><button id="exp">Yedeği indir</button><label for="imp">Yedekten yükle<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
    <div class="msg" id="msg"></div>
  </div>`;
  el.innerHTML=h;
}

function tab(which){
  const g=which==="gun";
  document.getElementById("tGun").setAttribute("aria-selected",g);
  document.getElementById("tDur").setAttribute("aria-selected",!g);
  document.getElementById("vGun").hidden=!g;document.getElementById("vDur").hidden=g;
}
document.getElementById("tGun").onclick=()=>tab("gun");
document.getElementById("tDur").onclick=()=>tab("dur");
document.getElementById("vGun").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="pv"){view=classDay(view,-1)||view;renderGun();return}
  if(b.id==="nx"){view=classDay(view,1)||view;renderGun();return}
  if(b.id==="gt"){view=home();renderGun();return}
  const seg=b.closest(".seg");if(!seg)return;
  const id=seg.dataset.id,s=b.dataset.s;
  save(id,rec.get(id)===s?"":s);
});
document.getElementById("vDur").addEventListener("click",e=>{
  if(e.target.closest("#exp")){
    const blob=new Blob([JSON.stringify({start:START,rec:Object.fromEntries(rec)},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="yoklama-yedek-"+today()+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    document.getElementById("msg").textContent="Yedek indirildi. İndirilenler klasöründe.";
    return;
  }
  const b=e.target.closest("button[data-d]");if(!b||b.classList.contains("fut"))return;
  view=b.dataset.d;renderGun();tab("gun");window.scrollTo({top:0});
});
document.getElementById("vDur").addEventListener("change",e=>{
  if(e.target.id==="st"&&e.target.value){START=e.target.value;persist();render()}
  if(e.target.id==="imp"&&e.target.files[0]){
    e.target.files[0].text().then(txt=>{
      const o=JSON.parse(txt);if(!o||typeof o.rec!=="object")throw 0;
      rec.clear();Object.entries(o.rec).forEach(([k,v])=>rec.set(k,v));if(o.start)START=o.start;
      persist();render();document.getElementById("msg").textContent="Yedek yüklendi: "+rec.size+" kayıt.";
    }).catch(()=>{document.getElementById("msg").textContent="Bu dosya bir yoklama yedeği değil. “Yedeği indir” ile alınan .json dosyasını seç."});
  }
});

load();render();
setInterval(renderDur,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(view<today()&&!document.getElementById("vGun").hidden)view=home();render()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
